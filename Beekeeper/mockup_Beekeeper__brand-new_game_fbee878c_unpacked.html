<style>
body{margin:0}
.win{position:relative;width:1120px;height:768px;overflow:hidden;box-sizing:border-box;font-family:'Segoe UI',Selawik,system-ui,-apple-system,sans-serif;color:#fff}
.chrome{height:32px;display:flex;align-items:center;justify-content:flex-end;color:rgba(255,255,255,.75);font-size:12px}
.chrome span{width:46px;text-align:center}
.bar{display:flex;align-items:center;justify-content:space-between;padding:4px 15px 10px 15px;gap:16px}
.tools{display:flex;gap:10px;align-items:center}
.tbtn{font:700 14px/20px 'Segoe UI',system-ui,sans-serif;color:var(--tint);border:1px solid var(--tint);background:rgba(255,255,255,.06);padding:6px 12px;border-radius:4px;display:inline-flex;align-items:center;gap:8px}
.stats{display:flex;gap:25px;align-items:center}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:56px}
.stat .l{font-size:14px;font-weight:700;opacity:.6;line-height:18px}
.stat .v{font-size:20px;font-weight:700;line-height:26px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:14px;opacity:.6}
.area{display:grid;grid-template-columns:340px minmax(0,1fr) 260px;gap:24px;padding:8px 30px 24px 30px;height:676px;box-sizing:border-box}
.col{display:flex;flex-direction:column;gap:16px;min-width:0;position:relative}
.glass{background:rgba(12,8,3,.55);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:20px;box-sizing:border-box}
.pt{margin:0 0 10px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.6);line-height:16px;display:flex;justify-content:space-between}
.art{height:204px;flex:none;border:1px dashed rgba(255,255,255,.32);border-radius:12px;background:rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:rgba(255,255,255,.6);font-size:12px;line-height:16px;text-align:center}
.catch{width:100%;height:64px;flex:none;border:0;border-radius:14px;background:var(--accent);color:#2B1D05;font:700 20px/24px 'Segoe UI',system-ui,sans-serif}
.meta{margin:0;font-size:13px;line-height:18px;color:rgba(255,255,255,.72)}
.log p{margin:0 0 14px 0;font-family:Newsreader,Georgia,serif;font-size:16px;line-height:24px}
</style>
</helmet>
<div class="win" style="background: {{bg}}; --accent: {{accent}}; --tint: {{tint}}">
  <div class="chrome" aria-hidden="true"><span>—</span><span>▢</span><span>✕</span></div>
  <div class="bar">
    <div class="tools">
      <button class="tbtn">Beekeeper <svg width="10" height="6" sc-camel-view-box="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"></path></svg></button>
      <button class="tbtn">New Game</button>
      <button class="tbtn">Options</button>
    </div>
    <div class="stats">
      <div class="stat"><span class="l">BEES</span><span class="v">0 <small>/ 20</small></span></div>
    </div>
  </div>
  <div class="area">
    <div class="col">
      <div class="art"><strong style="font-size: 13px; color: rgba(255,255,255,.75)">Pixel art frame</strong><span>170 × 102 art px, shown at 2× (340 × 204)</span></div>
      <button class="catch">Catch Bee</button>
      <p class="meta">Bare hands · 1 bee per catch</p>
    </div>
    <div class="col"></div>
    <div class="col">
      <div class="glass log" style="flex: 1">
        <h2 class="pt">The garden</h2>
        <p>Your bees are frolicking in the garden.</p>
        <p style="opacity: .7">The hive sits empty, humming faintly.</p>
      </div>
    </div>
  </div>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Honey&quot;,&quot;Default&quot;,&quot;Sunset&quot;,&quot;Moogle&quot;,&quot;Forest&quot;,&quot;OceanSky&quot;],&quot;default&quot;:&quot;Honey&quot;},&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:768}}">
class Component extends DCLogic {
  renderVals() {
    const T = {Honey:['#3B2A14','#24190A','#FFD300','#FFD300'],Default:['#008000','#005A00','#FFD700','#FFFFFF'],Sunset:['#1E3A48','#132833','#FFB557','#FDF3E3'],Moogle:['#141414','#080808','#FFE500','#FFFFFF'],Forest:['#5E5450','#433B37','#FFD700','#FFFFFF'],OceanSky:['#24788F','#185566','#FFD700','#FFFFFF']};
    const t = T[this.props.theme ?? 'Honey'] || T.Honey;
    return { bg: 'radial-gradient(ellipse at 50% 30%, ' + t[0] + ' 0%, ' + t[1] + ' 100%)', accent: t[2], tint: t[3] };
  }
}
</script>
