name: Build and Release (macOS)

# Mirrors build-sign-windows.yml's shape: build (and test) on every push/PR as a sanity
# check, but only package a DMG / publish a GitHub Release on an actual `v*` tag push.
#
# NOTE: this file must live here, at the repo root's .github/workflows/ — GitHub Actions
# only discovers workflows at that exact path, never inside a subdirectory's own
# .github/workflows/.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Determined before Build (not just for tag pushes) so it can patch Info.plist
      # below prior to `make build` copying that file into the app bundle — otherwise
      # the compiled app's own About-window version silently drifts from whatever tag
      # it's actually released under (see src/Info.plist's comment on these keys). Falls
      # back to whatever's already committed in Info.plist for branch/PR sanity builds,
      # matching build-sign-windows.yml's equivalent non-tag fallback.
      - name: Determine version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set app version from tag
        if: steps.version.outputs.is_tag == 'true'
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" src/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.version }}" src/Info.plist

      - name: Build
        run: make build

      - name: Test
        run: make test

      # ── Package + release (tag pushes only) ──────────────────────────────────
      # Everything below only runs for an actual `v*` tag push — branch pushes and PRs
      # stop after build/test above.

      # ── Sign with Developer ID + notarize (tag pushes only) ──────────────────
      # `make build` above ad-hoc-signs (codesign --sign -) which is fine for local dev
      # but Gatekeeper will block that on anyone else's Mac. For a real release we
      # re-sign with the Developer ID Application identity, submit to Apple's
      # notarization service, and staple the resulting ticket to the app *before*
      # it goes into the DMG — that's what lets it open without a security warning.
      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_P12_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$RUNNER_TEMP/cert.p12"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Re-sign app with Developer ID (hardened runtime)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "Developer ID Application: Leah Harris (HSLC6ND7F4)" \
            Honeycomb.app
          codesign --verify --deep --strict --verbose=2 Honeycomb.app

      - name: Notarize app
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"

          ditto -c -k --keepParent Honeycomb.app "$RUNNER_TEMP/Honeycomb.zip"

          xcrun notarytool submit "$RUNNER_TEMP/Honeycomb.zip" \
            --key "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait

          xcrun stapler staple Honeycomb.app

          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/Honeycomb.zip"

      - name: Clean up signing keychain
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Install create-dmg
        if: startsWith(github.ref, 'refs/tags/v')
        run: brew install create-dmg

      - name: Build DMG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist
          create-dmg \
            --volname "Honeycomb ${{ steps.version.outputs.version }}" \
            --app-drop-link 450 150 \
            "dist/Honeycomb-${{ steps.version.outputs.version }}.dmg" \
            "Honeycomb.app" \
            || true
          # create-dmg exits non-zero on some harmless warnings (e.g. Finder AppleEvents
          # not available in a headless CI session) even when the DMG was written fine —
          # verify the actual output file exists rather than trusting its exit code alone.
          test -f "dist/Honeycomb-${{ steps.version.outputs.version }}.dmg"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.dmg \
            --title "Honeycomb Card Suite ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --draft=false || \
          gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Honeycomb-mac
          path: |
            mac/Honeycomb.app
            mac/dist/
          retention-days: 30
